<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=>, initial-scale=1.0">
    <title>Document</title>
    <style>
    #main{
        height: 300px;
        width: 300px;
        margin: 20px auto;
        position: relative;
        transform-style: preserve-3d;
        transition: 1s;
    }
   #main:hover{
        transform: rotateY(180deg);
    }
    #card_A{
        height: 50%;
        width: 100%;
        position: absolute;
        z-index: 2;
        backface-visibility: hidden;
        
    }
    img{
        height: 100%;
        width: 100%;
    }
    #card_B{
        height: 50%;
        width: 100%;
        position: absolute;
        background-color: aqua;
        z-index: 1;

        transform: rotateY(180deg);
    }
    </style>
</head>

<body>
    <div id="main">
        <div id="card_A">
            <img src="https://plus.unsplash.com/premium_photo-1683910767532-3a25b821f7ae?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8ZnJlZSUyMGltYWdlc3xlbnwwfHwwfHx8MA%3D%3D"><img>
        </div>
        <div id="card_B">Yo!</div>
    </div>
</body>
</html>
