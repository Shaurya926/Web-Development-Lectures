<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #dc6a6a;

        }
        .Box {
            width: 100px;
            height: 100px;
            background-color: rgb(220, 54, 54);
            border: 2px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            gap: 50px;
        
        }
        .container {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            border: 1px solid black;
            background-color: rgb(188, 188, 221);
            height:90vh;
            width:90vw;
            margin: 1px;
            
            
        }
        h1{
            text-align: center;
        }

    </style>
</head>
<body>
    <h1>FlexBox Parent Properties</h1>
    <div class="container">
        <div class="Box">1</div>
        <div class="Box">2</div>
        <div class="Box">3</div>
        <div class="Box">4</div>
        <div class="Box">5</div>
        <div class="Box">6</div>
        <div class="Box">7</div>
        <div class="Box">8</div>
    </div>
</body>
</html>
