<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Live Location Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0a0f1e;
      --surface: #111827;
      --card: #151f30;
      --border: #1e3a5f;
      --accent: #00d4ff;
      --accent2: #0077ff;
      --text: #e2f0ff;
      --muted: #6b8caa;
      --danger: #ff4d6d;
      --success: #00e5a0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Syne', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      background-image:
        radial-gradient(ellipse at 20% 20%, rgba(0,100,255,0.08) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 80%, rgba(0,212,255,0.06) 0%, transparent 50%);
    }

    header {
      padding: 20px 32px;
      display: flex;
      align-items: center;
      gap: 14px;
      border-bottom: 1px solid var(--border);
      background: rgba(17,24,39,0.8);
      backdrop-filter: blur(12px);
      position: sticky; top: 0; z-index: 100;
    }

    .pulse-dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 0 rgba(0,212,255,0.6);
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(0,212,255,0.6); }
      70%  { box-shadow: 0 0 0 10px rgba(0,212,255,0); }
      100% { box-shadow: 0 0 0 0 rgba(0,212,255,0); }
    }

    header h1 {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text);
    }

    header h1 span { color: var(--accent); }

    .container {
      max-width: 960px;
      margin: 40px auto;
      padding: 0 24px;
    }

    .form-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      margin-bottom: 36px;
      position: relative;
      overflow: hidden;
    }

    .form-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent2), var(--accent));
    }

    .form-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 18px;
      margin-bottom: 20px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--muted);
      font-family: 'Space Mono', monospace;
    }

    input, select {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      color: var(--text);
      font-size: 0.9rem;
      font-family: 'Syne', sans-serif;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0,212,255,0.1);
    }

    input::placeholder { color: var(--muted); }

    select option { background: var(--surface); }

    .btn-row {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    button {
      cursor: pointer;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 0.88rem;
      transition: all 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      color: #fff;
      letter-spacing: 0.3px;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 24px rgba(0,119,255,0.4);
    }

    .btn-geo {
      background: rgba(0,212,255,0.08);
      color: var(--accent);
      border: 1px solid rgba(0,212,255,0.3);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-geo:hover {
      background: rgba(0,212,255,0.15);
    }

    .btn-clear {
      background: rgba(255,77,109,0.08);
      color: var(--danger);
      border: 1px solid rgba(255,77,109,0.25);
    }

    .btn-clear:hover { background: rgba(255,77,109,0.15); }

    /* Location Cards */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 1rem;
      font-weight: 800;
      color: var(--text);
    }

    .count-badge {
      background: rgba(0,212,255,0.12);
      color: var(--accent);
      border: 1px solid rgba(0,212,255,0.25);
      border-radius: 20px;
      padding: 4px 14px;
      font-size: 0.78rem;
      font-family: 'Space Mono', monospace;
    }

    .locations-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 18px;
    }

    .loc-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      position: relative;
      overflow: hidden;
      animation: slideIn 0.3s ease;
      transition: border-color 0.2s, transform 0.2s;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .loc-card:hover {
      border-color: rgba(0,212,255,0.35);
      transform: translateY(-2px);
    }

    .loc-card .card-pin {
      position: absolute;
      top: 16px; right: 16px;
      font-size: 1.2rem;
    }

    .loc-name {
      font-size: 1rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 6px;
    }

    .loc-area {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .loc-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }

    .tag {
      background: rgba(30,58,95,0.8);
      color: #8ab4d4;
      border-radius: 4px;
      padding: 3px 9px;
      font-size: 0.72rem;
      font-family: 'Space Mono', monospace;
    }

    .loc-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border);
      padding-top: 12px;
      margin-top: 4px;
    }

    .loc-phone {
      font-size: 0.8rem;
      color: var(--accent);
      font-family: 'Space Mono', monospace;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .loc-time {
      font-size: 0.7rem;
      color: var(--muted);
      font-family: 'Space Mono', monospace;
    }

    .btn-del {
      background: none;
      border: none;
      color: var(--muted);
      padding: 4px 8px;
      font-size: 0.8rem;
      cursor: pointer;
      border-radius: 4px;
      transition: color 0.15s, background 0.15s;
    }

    .btn-del:hover { color: var(--danger); background: rgba(255,77,109,0.1); }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }

    .empty-state .icon { font-size: 3rem; margin-bottom: 12px; }
    .empty-state p { font-size: 0.9rem; }

    .toast {
      position: fixed;
      bottom: 30px; right: 30px;
      background: var(--success);
      color: #001a0f;
      padding: 12px 22px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s;
      z-index: 999;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .geo-status {
      font-size: 0.78rem;
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      padding: 8px 0 0;
    }
    .geo-status.loading { color: var(--accent); }
    .geo-status.error { color: var(--danger); }

    @media (max-width: 600px) {
      .form-grid { grid-template-columns: 1fr; }
      header h1 { font-size: 1rem; }
    }
  </style>
</head>
<body>

<header>
  <div class="pulse-dot"></div>
  <h1>📍 Live <span>Location</span> Tracker</h1>
</header>

<div class="container">

  <!-- Add Form -->
  <div class="form-card">
    <div class="form-title">
      <span>⊕</span> Add New Location
    </div>

    <div class="form-grid">
      <div class="field">
        <label>City</label>
        <input type="text" id="city" placeholder="e.g. Mumbai" />
      </div>
      <div class="field">
        <label>Area / Locality</label>
        <input type="text" id="area" placeholder="e.g. Bandra West" />
      </div>
      <div class="field">
        <label>Pincode</label>
        <input type="text" id="pincode" placeholder="e.g. 400050" maxlength="10" />
      </div>
      <div class="field">
        <label>Country</label>
        <input type="text" id="country" placeholder="e.g. India" />
      </div>
      <div class="field">
        <label>Phone Number</label>
        <input type="tel" id="phone" placeholder="e.g. +91 9876543210" />
      </div>
      <div class="field">
        <label>Label / Name</label>
        <input type="text" id="label" placeholder="e.g. Home, Office…" />
      </div>
    </div>

    <div class="btn-row">
      <button class="btn-primary" onclick="addLocation()">+ Add Location</button>
      <button class="btn-geo" onclick="autoDetect()">
        <span>◎</span> Auto-Detect GPS
      </button>
      <button class="btn-clear" onclick="clearForm()">✕ Clear</button>
    </div>
    <div class="geo-status" id="geoStatus"></div>
  </div>

  <!-- Location List -->
  <div class="section-header">
    <div class="section-title">Tracked Locations</div>
    <div class="count-badge" id="countBadge">0 entries</div>
  </div>

  <div class="locations-grid" id="locationGrid">
    <div class="empty-state" id="emptyState">
      <div class="icon">🗺️</div>
      <p>No locations tracked yet.<br/>Add one above to get started.</p>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="index.js"></script>
</body>
</html>
