    <script>
        let arr=[1,2,3,4,5,6]
        arr.push(7)

        arr.pop()

        console.log(arr)

        let data=arr.find(function(a){
            return a==5
        })
        let data1=arr.forEach((a,b,c)=>{
            return a
        })
        console.log(data1)
         
        let mapD=arr.map((a,b,c)=>{
            return a
        })
        console.log(mapD==arr)

        let filterD=arr.filter((a,b,c)=>{
            return a
        })
        console.log(filterD==arr)

        let sum=arr.reduce((a,b,c)=>{
            return a+b
        })
        console.log(sum)
