<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MyWebsite</title>
    <style>
        body {
            margin: 0;
            font-family: Georgia, serif;
            background: #f5f5f5;
        }

        /* Header */
        header {
            background: black;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header a {
            color: white;
            text-decoration: none;
            margin-left: 15px;
        }

        /* Cards container */
        .container {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 60px;
        }

        /* Card */
        .card {
            background: white;
            width: 260px;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            position: relative;
        }

        /* Status */
        .status {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            color: white;
        }

        .online {
            background: limegreen;
        }

        .offline {
            background: red;
        }

        /* Avatar */
        .avatar {
            width: 80px;
            height: 80px;
            background: black;
            color: white;
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        h2 {
            margin: 5px 0;
        }

        .role {
            color: gray;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .desc {
            border: 1px dashed gray;
            padding: 10px;
            font-size: 14px;
            margin-bottom: 15px;
        }

        button {
            background: black;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<header>
    <h2>MyWebsite</h2>
    <nav>
        <a href="#">Home</a> |
        <a href="#">About</a> |
        <a href="#">Contact</a>
    </nav>
</header>

<div class="container">

    <!-- Card 1 -->
    <div class="card">
        <span class="status online">Online</span>
        <div class="avatar">R</div>
        <h2>Rahul</h2>
        <div class="role">Web Developer</div>
        <div class="desc">Builds Modern Websites using HTML and CSS</div>
        <button>View Profile</button>
    </div>

    <!-- Card 2 -->
    <div class="card">
        <span class="status offline">Offline</span>
        <div class="avatar">N</div>
        <h2>Neha</h2>
        <div class="role">UI Designer</div>
        <div class="desc">Designs clean and user-friendly interfaces</div>
        <button>View Profile</button>
    </div>

    <!-- Card 3 -->
    <div class="card">
        <span class="status online">Online</span>
        <div class="avatar">A</div>
        <h2>Aman</h2>
        <div class="role">Backend Developer</div>
        <div class="desc">Works with server logic and databases</div>
        <button>View Profile</button>
    </div>

</div>

</body>
</html>
