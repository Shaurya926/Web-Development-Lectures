<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FaceAuth — Face Recognition Login</title>

  <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <script defer src="script.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:#0a0c10;
      --surface:#111318;
      --border:#1e2230;
      --accent:#00e5ff;
      --accent2:#7c3aed;
      --success:#22c55e;
      --danger:#ef4444;
      --warn:#f59e0b;
      --text:#e2e8f0;
      --muted:#64748b;
      --radius:16px;
      --glow:0 0 40px rgba(0,229,255,.12);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(circle at 20% 20%, rgba(0,229,255,.07), transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(124,58,237,.07), transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      gap: 1.5rem;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--glow);
    }

    .video-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 4/3;
      background: #060810;
    }

    video, canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .status-bar {
      display: flex;
      align-items: center;
      gap: .6rem;
      padding: .7rem 1rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.03);
      font-size: .82rem;
    }

    button {
      padding: .75rem 1rem;
      border-radius: 10px;
      border: 0;
      cursor: pointer;
      font-family: 'Space Mono', monospace;
    }

    .btn-primary { background: var(--accent); }
    .btn-secondary { background: rgba(124,58,237,.2); color:#a78bfa; }

    footer {
      font-size: .72rem;
      color: var(--muted);
      text-align: center;
    }
    .diary-modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.65);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}

.diary-modal.hidden {
  display: none;
}

.diary-sheet {
  width: 90%;
  max-width: 500px;
  background: #111318;
  border: 1px solid #1e2230;
  border-radius: 16px;
  padding: 20px;
  animation: pop 0.25s ease;
}

@keyframes pop {
  from { transform: scale(0.85); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

textarea {
  width: 100%;
  height: 200px;
  margin-top: 10px;
  background: #0a0c10;
  color: white;
  border: 1px solid #333;
  border-radius: 10px;
  padding: 10px;
}

  </style>
</head>

<body>

<div class="page">

  <div class="card">

    <div class="video-wrap">
      <video id="video" autoplay muted playsinline></video>
      <canvas id="overlay"></canvas>
    </div>

    <div style="padding:1rem">

      <div class="status-bar" id="status-bar">
        <div id="status-text">Ready</div>
      </div>

      <div style="display:grid;gap:.5rem;margin-top:1rem">
        <button class="btn-primary" onclick="startCamera()">Start Camera</button>
        <button class="btn-secondary" onclick="registerFace()">Register Face</button>
        <button class="btn-secondary" onclick="loginFace()">Login</button>
      </div>

    </div>

  </div>

  <footer>
    Face recognition demo using face-api.js
  </footer>

</div>

<!-- ✅ DIARY MODAL (FIXED OUTSIDE PAGE) -->
<div id="diaryModal" class="diary-modal hidden">
  <div class="diary-sheet">
    
    <div class="diary-header">
      <h2>My Private Diary</h2>
      <button onclick="closeDiary()">✖</button>
    </div>

    <textarea id="diaryText" placeholder="Write your thoughts here..."></textarea>

    <div class="diary-actions">
      <button onclick="saveDiary()">Save</button>
    </div>

  </div>
</div>

</body>
</html>
